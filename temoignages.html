<section style="max-width:600px; margin:40px auto; padding:20px; background:white; border-radius:12px">
  <h2 style="color:#1a4d8f; text-align:center">💬 Espace de témoignages</h2>
  
  <form action="https://wa.me/243997015701" method="get" target="_blank" style="display:flex; flex-direction:column; gap:12px; margin-top:20px">
    
    <input type="hidden" name="text" id="messageComplet">
    
    <input type="text" id="nom" placeholder="Votre nom" required 
           style="padding:12px; border:1px solid #ddd; border-radius:8px; font-size:16px">
    
    <textarea id="temoignage" placeholder="Votre témoignage..." required rows="5"
              style="padding:12px; border:1px solid #ddd; border-radius:8px; font-size:16px"></textarea>
    
    <button type="submit" onclick="preparerMessage()"
            style="padding:14px; background:#25D366; color:white; border:none; border-radius:8px; font-size:16px; font-weight:bold; cursor:pointer">
      Envoyer sur WhatsApp
    </button>
  </form>
</section>

<script>
function preparerMessage(){
  let nom = document.getElementById('nom').value;
  let texte = document.getElementById('temoignage').value;
  let date = new Date().toLocaleDateString('fr-FR');
  
  let msg = `🙏 NOUVEAU TEMOIGNAGE CBB\n👤 De: ${nom}\n📅 ${date}\n\n💬 ${texte}\n\n---\nEnvoyé depuis cbb-lubumbashi.netlify.app`;
  
  document.getElementById('messageComplet').value = msg;
}
</script>

</body>
</html>
<script>
function envoyerWhatsApp(){
  let nom = document.getElementById('nom').value.trim();
  let texte = document.getElementById('temoignage').value.trim();

  if(!nom || !texte){
    alert('Merci de remplir tous les champs 🙏');
    return;
  }

  let date = new Date().toLocaleDateString('fr-FR');
  let site = window.location.href; // 👈 Récupère l’URL actuelle auto
  
  let message = `🙏 NOUVEAU TEMOIGNAGE CBB%0A👤 De: ${nom}%0A📅 ${date}%0A%0A💬 ${texte}%0A%0A---%0AEnvoyé depuis ${site}`;

  let url = `https://wa.me/243997015701?text=${message}`;
  window.location.href = url;
}
</script>
